<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#15803d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="NestLog">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>NestLog</title>
<style>
:root{--bg:#f4f6f4;--card:#fff;--ink:#14201a;--mute:#66736c;--line:#e3e8e4;--acc:#15803d;--acc-ink:#fff;--acc-soft:#e6f4ea;--warn:#c2410c;--warn-soft:#fff1e6;--bad:#b3261e;--bad-soft:#fdecea;--r:14px}
@media (prefers-color-scheme:dark){:root{--bg:#0e1411;--card:#17201b;--ink:#e8efe9;--mute:#93a39a;--line:#26322b;--acc:#4ade80;--acc-ink:#05260f;--acc-soft:#16301f;--warn:#fb923c;--warn-soft:#2e1d10;--bad:#f87171;--bad-soft:#321514}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
#app{display:flex;flex-direction:column;height:100%;height:100dvh;max-width:560px;margin:0 auto}
#bar{display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top) + 6px) 10px 6px;min-height:56px;flex:none}
#bar h1{margin:0;font-size:22px;line-height:1.1;letter-spacing:-.01em}
.ttl{flex:1;min-width:0}
.mk{vertical-align:-8px;margin-right:10px;border-radius:8px}
.crumb{font-size:12px;color:var(--mute);margin-bottom:1px}
.ib{width:44px;height:44px;border-radius:12px;border:0;background:transparent;display:grid;place-items:center;cursor:pointer;flex:none}
.ib:active{background:var(--line)}
.pill{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 10px;font-size:12px;color:var(--mute);cursor:pointer;flex:none}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--acc);display:block}
.pill.warn i{background:var(--warn)}.pill.bad i{background:var(--bad)}.pill.busy i{background:var(--mute);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.3}}
#tabs{display:flex;gap:6px;padding:0 16px 8px;overflow-x:auto;flex:none;scrollbar-width:none}
#tabs::-webkit-scrollbar{display:none}
#tabs:empty{display:none}
.tab{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;font-size:14px;white-space:nowrap;cursor:pointer}
.tab.on{background:var(--acc);border-color:var(--acc);color:var(--acc-ink);font-weight:600}
#ptr{flex:none;height:0;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--mute);transition:height .18s ease}
#ptr.drag{transition:none}
#view{flex:1;overflow-y:auto;padding:4px 16px 28px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
#toast{flex:none;display:flex;align-items:center;gap:10px;background:var(--ink);color:var(--bg);padding:12px 16px calc(12px + env(safe-area-inset-bottom));font-size:15px}
#toast[hidden]{display:none}
#toast span{flex:1}
#toast button{background:transparent;border:0;color:var(--acc);font-weight:700;padding:6px 8px;cursor:pointer}
@media (prefers-color-scheme:light){#toast button{color:#86efac}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin:0 0 12px}
.hero{padding:6px 2px 14px}
.lbl{font-size:13px;color:var(--mute)}
.big{font-size:40px;font-weight:700;letter-spacing:-.02em;line-height:1.1;margin:2px 0}
.mute{color:var(--mute)}
.sm{font-size:13px}
.btn{height:50px;border-radius:var(--r);border:1px solid var(--line);background:var(--card);padding:0 18px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:active{filter:brightness(.95)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.btn.bad{color:var(--bad);border-color:var(--bad)}
.btn.block{width:100%}
.btn[disabled]{opacity:.5}
.row{display:flex;gap:10px;align-items:center}
.row>.grow{flex:1}
.gap{height:12px}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);margin:20px 2px 8px;font-weight:600}
.sec-h{display:flex;justify-content:space-between;align-items:center}
.link{background:none;border:0;color:var(--acc);font-weight:600;padding:8px 2px;cursor:pointer;font-size:14px}
.bar{height:8px;border-radius:99px;background:var(--acc-soft);overflow:hidden;margin-top:6px}
.bar>b{display:block;height:100%;background:var(--acc);border-radius:99px}
.cat{padding:8px 0}
.cat .row{justify-content:space-between}
.rc{padding:0;overflow:hidden}
.rc-main{width:100%;display:flex;gap:12px;align-items:center;justify-content:space-between;background:none;border:0;padding:14px 16px;text-align:left;cursor:pointer;min-height:60px}
.rc-name{font-weight:600}
.rc-sub{font-size:13px;color:var(--mute)}
.rc-amt{font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.tag{display:inline-block;font-size:11px;font-weight:700;border-radius:99px;padding:2px 8px;margin-top:3px}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.tag.mute{background:var(--line);color:var(--mute)}
.rc-detail{border-top:1px solid var(--line);padding:10px 16px 14px}
.ln{display:flex;justify-content:space-between;padding:4px 0;font-variant-numeric:tabular-nums}
.day{font-size:13px;color:var(--mute);margin:16px 2px 6px;font-weight:600}
label{display:block;font-size:13px;color:var(--mute);margin:14px 2px 6px}
input,select,textarea{width:100%;height:48px;border-radius:12px;border:1px solid var(--line);background:var(--card);padding:0 14px;font-size:16px}
textarea{height:auto;padding:12px 14px;min-height:48px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--acc);outline-offset:0;border-color:transparent}
.amt{font-size:34px;font-weight:700;height:64px;text-align:left;letter-spacing:-.01em}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1;min-width:70px;height:46px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-weight:600;cursor:pointer}
.seg button.on{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.chips{display:flex;gap:8px;margin-top:8px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:7px 14px;font-size:14px;cursor:pointer}
.line{display:grid;grid-template-columns:1fr 112px 44px;gap:8px;margin-top:8px;align-items:center}
.line .rest{height:48px;display:flex;align-items:center;justify-content:flex-end;font-weight:600;color:var(--mute);font-variant-numeric:tabular-nums}
.err{background:var(--bad-soft);color:var(--bad);border-radius:12px;padding:10px 14px;margin:14px 0;font-size:14px}
.ok{background:var(--acc-soft);color:var(--acc);border-radius:12px;padding:10px 14px;font-size:14px}
.note{background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:12px 14px;margin:0 0 12px;font-size:14px}
.stack>*+*{margin-top:12px}
.soon{text-align:center;padding:34px 12px}
.soon .badge{display:inline-block;background:var(--acc-soft);color:var(--acc);font-weight:700;font-size:12px;border-radius:99px;padding:4px 12px;margin-bottom:12px}
.soon h3{margin:0 0 8px;font-size:20px}
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;opacity:0;pointer-events:none;transition:opacity .2s}
#scrim.on{opacity:1;pointer-events:auto}
#drawer{position:fixed;top:0;bottom:0;left:0;width:min(82vw,320px);background:var(--card);z-index:21;transform:translateX(-102%);transition:transform .22s ease;padding:calc(env(safe-area-inset-top) + 14px) 12px calc(env(safe-area-inset-bottom) + 14px);display:flex;flex-direction:column;box-shadow:4px 0 24px rgba(0,0,0,.2)}
#drawer.on{transform:none}
#drawer .brand{font-size:24px;font-weight:800;padding:6px 12px 14px;letter-spacing:-.02em}
.nav{display:flex;align-items:center;justify-content:space-between;width:100%;border:0;background:none;border-radius:12px;padding:0 12px;height:50px;font-size:17px;text-align:left;cursor:pointer}
.nav.on{background:var(--acc-soft);color:var(--acc);font-weight:700}
.nav small{font-size:11px;color:var(--mute);font-weight:600}
.grow-s{flex:1}
#lock{position:fixed;inset:0;background:var(--bg);z-index:40;display:flex;flex-direction:column;justify-content:center;padding:28px;max-width:560px;margin:0 auto}
#lock[hidden]{display:none}
#lock h1{margin:0 0 6px;font-size:30px}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:50;display:flex;align-items:flex-end;justify-content:center}
#modal[hidden]{display:none}
#modal .sheet{background:var(--card);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom))}
#modal h3{margin:0 0 6px}
.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}

.thumb{max-width:150px;max-height:190px;border-radius:12px;border:1px solid var(--line);display:block;margin:0 auto 14px;object-fit:cover}
.ld{display:block;margin:0 auto 14px}
.lw{transform-box:fill-box;transform-origin:50% 100%;animation:lwig .6s ease-in-out infinite}
.lw2{animation-delay:.08s}.lw3{animation-delay:.16s}
@keyframes lwig{0%,60%,100%{transform:rotate(0)}15%{transform:rotate(-10deg)}30%{transform:rotate(9deg)}45%{transform:rotate(-4deg)}}
@media (prefers-reduced-motion:reduce){.lw{animation:none}}
#ptr .ld{display:inline-block;margin:0 8px 0 0;vertical-align:middle}
.spin{width:28px;height:28px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--acc);animation:rot .9s linear infinite;margin:0 auto 14px}
@keyframes rot{to{transform:rotate(360deg)}}
.sec-t{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);margin:14px 0 2px}
.it{padding:10px 0;border-bottom:1px solid var(--line)}
.it:last-child{border-bottom:0}
.it-top{display:grid;grid-template-columns:1fr 104px;gap:10px;align-items:center}
.it-d{font-weight:600;overflow-wrap:anywhere}
.it-bot{display:grid;grid-template-columns:1fr 40px;gap:8px;margin-top:6px;align-items:center}
.it select,.it input{height:40px;font-size:15px}
.it-bot{margin-top:4px}
.it-bot .ib{width:40px;height:40px}
.it input{text-align:right}
.tot-r{display:flex;justify-content:space-between;align-items:center;padding:6px 0}
.tot-r input{width:112px;height:42px;text-align:right}
.match{font-size:14px;font-weight:600;margin-top:6px}
</style>
</head>
<body>
<div id="app">
  <header id="bar"></header>
  <nav id="tabs"></nav>
  <div id="ptr" role="status" aria-live="polite"></div>
  <main id="view"></main>
  <div id="toast" hidden></div>
</div>
<input id="cam" type="file" accept="image/*" capture="environment" hidden aria-label="Take a photo of a receipt">
<input id="pick" type="file" accept="image/*" hidden aria-label="Choose a receipt photo">
<div id="scrim" data-act="closeDrawer"></div>
<aside id="drawer" aria-label="Menu"></aside>
<div id="lock" hidden>
  <h1>NestLog</h1>
  <p class="mute">Enter the PIN to continue.</p>
  <form data-form="unlock">
    <input id="lockpin" name="pin" type="password" inputmode="numeric" autocomplete="off" placeholder="PIN" aria-label="PIN">
    <div class="gap"></div>
    <button class="btn pri block">Unlock</button>
  </form>
  <button class="link" data-act="forget" style="margin-top:14px">Forget this phone</button>
</div>
<div id="modal" hidden><div class="sheet"></div></div>

<script>
(() => {
'use strict';

/* ================= Basics ================= */
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const DEF_CATS = ['Groceries','Dining Out','Household','Home Maintenance','Utilities','Phone and Internet','Gas','Transit and Parking','Health and Pharmacy','Personal Care','Clothing','Kids','Pets','Entertainment','Subscriptions','Travel','Gifts and Donations','Other'];
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
const ymd = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const monthKey = d => d.getFullYear() + '-' + pad(d.getMonth() + 1);
const parseYMD = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const shiftMonth = (k, n) => { const [y, m] = k.split('-').map(Number); return monthKey(new Date(y, m - 1 + n, 1)); };
const monthLabel = k => { const [y, m] = k.split('-').map(Number); return MONTHS[m - 1] + ' ' + y; };
const money = new Intl.NumberFormat('en-CA', { style: 'currency', currency: 'CAD' });
const fmt = c => money.format(c / 100);
const uid = (pre = 'r') => pre + '_' + (crypto.randomUUID ? crypto.randomUUID().replace(/-/g, '').slice(0, 20) : Date.now().toString(36) + Math.random().toString(36).slice(2, 10));
// Money is handled in whole cents everywhere so splits always add up exactly.
function toCents(s) {
  s = String(s ?? '').replace(/[$,\s]/g, '');
  if (s === '' || s === '.' || !/^\d*\.?\d{0,2}$/.test(s)) return null;
  const [a, b = ''] = s.split('.');
  return parseInt(a || '0', 10) * 100 + parseInt((b + '00').slice(0, 2), 10);

  get(k, d) { try { const v = localStorage.getItem('ledger.' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('ledger.' + k, JSON.stringify(v)); } catch (e) {} },

<circle cx="-12" cy="22" r="5" fill="#a8743f" opacity="0.5"/></g><g transform="translate(0 0)"><path d="M412 296 C418 262 424 236 436 206" stroke="#bfe5c8" stroke-width="7" fill="none" stroke-linecap="round"/><path d="M436 206 C416 196 408 170 414 146 C438 152 448 182 436 206Z" fill="#bfe5c8"/><path d="M430 232 C452 226 468 206 470 184 C446 184 430 204 430 232Z" fill="#9fd6b0"/><path d="M420 262 C400 258 386 242 384 222 C406 222 420 238 420 262Z" fill="#9fd6b0"/></g><path d="M96 280 C104 392 188 440 256 440 C324 440 408 392 416 280 Q256 330 96 280Z" fill="#b4804c"/><g fill="none" stroke-linecap="round"><path d="M110 306 Q256 374 402 306" stroke="#dcae78" stroke-width="17"/><path d="M128 346 Q256 410 384 346" stroke="#93633a" stroke-width="17"/><path d="M172 392 Q256 428 340 392" stroke="#dcae78" stroke-width="15"/><path d="M92 278 Q256 336 420 278" stroke="#cf9d66" stroke-width="24"/><path d="M104 272 Q256 326 408 272" stroke="#efcb98" stroke-width="9"/><path d="M90 276 L66 254" stroke="#cf9d66" stroke-width="10"/><path d="M422 276 L448 258" stroke="#cf9d66" stroke-width="10"/></g></g></svg>`; };
const IC = {
  menu: svg('<path d="M4 7h16M4 12h16M4 17h16"/>'),

const saveQ = () => store.set('queue', S.queue.map(({ sending, ...q }) => q));

/* ================= Backend calls ================= */
async function api(action, payload = {}) {
  const ctl = new AbortController();
  const t = setTimeout(() => ctl.abort(), action === 'scan' ? 70000 : 30000);
  let res;
  try {
    // Plain text body keeps this a simple request, so the browser does not need a preflight.
    res = await fetch(S.cfg.url, { method: 'POST', body: JSON.stringify({ action, pin: S.cfg.pin, ...payload }), signal: ctl.signal });
  } finally { clearTimeout(t); }
  let j;
  try { j = await res.json(); } catch (e) { throw new Error('The script did not reply. Check the link.'); }
  if (!j.ok) { const e = new Error(j.error || 'Request failed'); e.server = true; throw e; }
  return j;
}
async function refresh() {
  const since = shiftMonth(monthKey(new Date()), -13) + '-01';
  const j = await api('list', { since });
  S.rows = j.rows.map(r => ({ id: r.id, date: r.date, merchant: r.merchant, category: r.category, note: r.note, cents: Math.round(r.amount * 100), paidBy: r.paidBy, account: r.account, ratio: typeof r.ratio === 'number' ? r.ratio : null }));
  S.meta = { ...S.meta, ...j.meta };
  S.income = (j.income || []).map(r => ({ id: r.id, date: r.date, person: r.person, job: r.job, gross: r.gross === null ? null : Math.round(r.gross * 100), net: Math.round(r.net * 100), account: r.account, note: r.note }));
  S.jobs = (j.jobs || []).map(r => ({ id: r.id, person: r.person, name: r.name, freq: r.freq, net: Math.round(r.typicalNet * 100), nextPay: r.nextPay || '', active: r.active !== false }));
  S.lastSync = Date.now();
  store.set('rows', S.rows); store.set('meta', S.meta); store.set('income', S.income); store.set('jobs', S.jobs);
}
function applyAdded(rc) {
  if (S.rows.some(r => r.id === rc.id)) return;
  rc.lines.forEach(l => S.rows.push({ id: rc.id, date: rc.date, merchant: rc.merchant, category: l.category, note: rc.note, cents: l.cents, paidBy: rc.paidBy, account: rc.account, ratio: null }));
}
function opLabel(q) {
  return q.type === 'add' ? q.receipt.merchant : q.type === 'addIncome' ? q.entry.job : q.type === 'saveJob' ? q.job.name : q.type === 'remove' ? 'a deleted expense' : q.type === 'removeIncome' ? 'a deleted paycheque' : 'a deleted job';
}
async function runOp(q) {
  if (q.type === 'add') { await api('add', { receipt: q.receipt }); applyAdded(q.receipt); }
  else if (q.type === 'remove') { await api('remove', { id: q.id }); S.rows = S.rows.filter(r => r.id !== q.id); }
  else if (q.type === 'addIncome') { await api('addIncome', { entry: q.entry }); applyIncome(q.entry); }
  else if (q.type === 'removeIncome') { await api('removeIncome', { id: q.id }); S.income = S.income.filter(r => r.id !== q.id); }
  else if (q.type === 'saveJob') { await api('saveJob', { job: q.job }); const i = S.jobs.findIndex(j => j.id === q.job.id); if (i >= 0) S.jobs[i] = { ...q.job }; else S.jobs.push({ ...q.job }); }
  else if (q.type === 'removeJob') { await api('removeJob', { id: q.id }); S.jobs = S.jobs.filter(j => j.id !== q.id); }
}
function applyIncome(e) {
  if (!S.income.some(r => r.id === e.id)) S.income.push({ id: e.id, date: e.date, person: e.person, job: e.job, gross: e.gross, net: e.net, account: e.account, note: e.note });
  if (e.jobId && e.nextPay) { const j = S.jobs.find(x => x.id === e.jobId); if (j) j.nextPay = e.nextPay; }
}
async function flush() {
  if (S.syncing || !S.cfg.url || S.locked) return;
  S.syncing = true; S.authErr = false; S.netErr = false; paintBar();
  if (!S.lastSync && !S.rows.length && !S.queue.length && /^#?\/?$|^#\/home/.test(location.hash)) renderKeep(); // first load: show the loader card
  try {
    while (S.queue.length) {
      const q = S.queue[0];
      q.sending = true;
      try {
        await runOp(q);
      } catch (e) {
        q.sending = false;
        if (e.server && !/pin|tries/i.test(e.message)) {
          // The script refused this one entry. Park it so it never blocks the rest, and tell the user.
          S.queue.shift(); saveQ();
          S.failed.push({ op: { ...q, sending: undefined }, label: opLabel(q), reason: e.message }); store.set('failed', S.failed);
          continue;
        }
        throw e;
      }
      S.queue.shift(); saveQ();
    }
    await refresh();
  } catch (e) {
    if (e.server) S.authErr = true; else S.netErr = true;
  } finally {
    S.syncing = false; paintBar(); renderKeep();
    // Anything saved while this sync was finishing still needs sending.
    if (S.queue.length && !S.netErr && !S.authErr) setTimeout(flush, 0);
  }
}

/* ================= Data helpers ================= */
function allReceipts() {
  const removed = new Set(S.queue.filter(q => q.type === 'remove').map(q => q.id));
  const map = new Map();
  const put = (r, pending) => {
    let x = map.get(r.id);
    if (!x) { x = { id: r.id, date: r.date, merchant: r.merchant, paidBy: r.paidBy, account: r.account, note: r.note, lines: [], total: 0, pending, flag: null }; map.set(r.id, x); }
    x.lines.push({ category: r.category, cents: r.cents, ratio: r.ratio });
    x.total += r.cents;
    if (r.ratio !== null && r.ratio > S.meta.multiplier && (!x.flag || r.ratio > x.flag.ratio)) x.flag = { ratio: r.ratio, category: r.category };
  };
  S.rows.forEach(r => { if (!removed.has(r.id)) put(r, false); });
  S.queue.forEach(q => { if (q.type === 'add') q.receipt.lines.forEach(l => put({ ...q.receipt, category: l.category, cents: l.cents, ratio: null }, true)); });
  return [...map.values()].sort((a, b) => b.date.localeCompare(a.date));
}
const sum = rs => rs.reduce((t, r) => t + r.total, 0);
const inMonth = (rs, k) => rs.filter(r => r.date.slice(0, 7) === k);
function catTotals(rs) {
  const m = {};
  rs.forEach(r => r.lines.forEach(l => { m[l.category] = (m[l.category] || 0) + l.cents; }));
  return Object.entries(m).sort((a, b) => b[1] - a[1]);
}
function statusInfo() {
  if (!S.cfg.url) return ['warn', 'Not connected'];
  if (S.syncing) return ['busy', 'Syncing'];
  if (S.authErr) return ['bad', 'Needs PIN'];
  if (S.queue.length) return ['warn', (navigator.onLine ? 'Waiting to sync' : 'Offline') + ' (' + S.queue.length + ')'];
  if (S.netErr) return ['warn', 'Offline'];
  return ['', 'Synced'];
}

async function runScan(makePayload, thumb, source) {
  const token = ++S.scanToken;
  S.scan = { status: 'reading', thumb, source };
  go('/expenses/scan');
  try {
    const j = await api('scan', typeof makePayload === 'function' ? await makePayload() : makePayload);
    if (token !== S.scanToken || !S.scan) return;
    const r = j.receipt;
    if (!r.items || !r.items.length) throw new Error(source === 'photo' ? 'No items were found on that photo. Try again in better light, or add it by hand.' : 'No items were found in that text. Check that the item lines are included, or add it by hand.');
    S.scan = reviewFrom(r, S.scan.thumb, source);
  } catch (e) {
    if (token !== S.scanToken || !S.scan) return;
    const msg = e.server ? e.message : (e.name === 'TypeError' || e.name === 'AbortError') ? 'Could not reach your Sheet. Check your connection and try again.' : (e.message || 'Could not read that receipt.');
    S.scan = { ...S.scan, status: 'error', error: msg };

}

/* ================= Income and jobs ================= */
const FREQS = ['Weekly', 'Every 2 weeks', 'Twice a month', 'Monthly', 'Irregular'];
const addDays = (s, n) => { const d = parseYMD(s); d.setDate(d.getDate() + n); return ymd(d); };
const lastDay = (y, m) => new Date(y, m + 1, 0).getDate();
function advanceOnce(s, freq) {
  const d = parseYMD(s), y = d.getFullYear(), m = d.getMonth(), day = d.getDate();
  if (freq === 'Weekly') return addDays(s, 7);
  if (freq === 'Every 2 weeks') return addDays(s, 14);
  if (freq === 'Twice a month') {
    if (day < 15) return ymd(new Date(y, m, 15));
    if (day < lastDay(y, m)) return ymd(new Date(y, m, lastDay(y, m)));
    return ymd(new Date(y, m + 1, 15));
  }
  if (freq === 'Monthly') return ymd(new Date(y, m + 1, Math.min(day, lastDay(y, m + 1))));
  return null;
}
// After a paycheque is logged, the next one moves forward at least one pay period and always past the date logged.
function nextPayFor(job, date) {
  if (job.freq === 'Irregular') return job.nextPay || '';
  let n = advanceOnce(job.nextPay || date, job.freq), guard = 0;
  while (n && n <= date && guard++ < 60) n = advanceOnce(n, job.freq);
  return n || '';
}
const monthlyOf = j => ({ 'Weekly': j.net * 52 / 12, 'Every 2 weeks': j.net * 26 / 12, 'Twice a month': j.net * 2, 'Monthly': j.net })[j.freq] || 0;
const dayLabel = s => parseYMD(s).toLocaleDateString('en-CA', { weekday: 'short', month: 'short', day: 'numeric' });

function effIncome() {
  const removed = new Set(S.queue.filter(q => q.type === 'removeIncome').map(q => q.id));
  const out = S.income.filter(r => !removed.has(r.id)).map(r => ({ ...r, pending: false }));
  S.queue.forEach(q => { if (q.type === 'addIncome' && !out.some(r => r.id === q.entry.id)) out.push({ id: q.entry.id, date: q.entry.date, person: q.entry.person, job: q.entry.job, gross: q.entry.gross, net: q.entry.net, account: q.entry.account, note: q.entry.note, pending: true }); });
  return out.sort((a, b) => b.date.localeCompare(a.date));
}
function effJobs() {
  let jobs = S.jobs.map(j => ({ ...j }));
  S.queue.forEach(q => {
    if (q.type === 'saveJob') { const i = jobs.findIndex(j => j.id === q.job.id); if (i >= 0) jobs[i] = { ...q.job }; else jobs.push({ ...q.job }); }
    if (q.type === 'removeJob') jobs = jobs.filter(j => j.id !== q.id);
    if (q.type === 'addIncome' && q.entry.jobId && q.entry.nextPay) { const j = jobs.find(x => x.id === q.entry.jobId); if (j) j.nextPay = q.entry.nextPay; }
  });
  return jobs;
}

/* ================= CSV export ================= */
function csvOf(rs) {
  const q = v => '"' + String(v ?? '').replace(/"/g, '""') + '"';
  const out = [['Receipt ID', 'Date', 'Merchant', 'Category', 'Note', 'Amount', 'Paid by', 'Account'].map(q).join(',')];
  rs.forEach(r => r.lines.forEach(l => out.push([r.id, r.date, r.merchant, l.category, r.note, (l.cents / 100).toFixed(2), r.paidBy, r.account].map(q).join(','))));
  return '﻿' + out.join('\r\n');
}
async function exportCSV(rs, name) {
  if (!rs.length) { toast('Nothing to export.'); return; }
  await shareCSV(csvOf(rs), name);
}
async function shareCSV(text, name) {
  const file = new File([text], name, { type: 'text/csv' });
  try {
    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file] }); return; }
  } catch (e) { if (e && e.name === 'AbortError') return; }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(file); a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}

(function () {

  const SHOW = 44, DRAG = 0.45, READY = SHOW / DRAG; // finger travel needed before release counts

  const set = (h, txt) => { box.style.height = h + 'px'; if (txt !== undefined) box.textContent = txt; };
  const idle = () => new Promise(res => { const t = setInterval(() => { if (!S.syncing) { clearInterval(t); res(); } }, 120); });
  async function run() {
    busy = true; box.classList.remove('drag'); set(SHOW, ''); box.innerHTML = LOADER(26) + 'Refreshing';
    const t0 = Date.now();
    if (S.syncing) await idle(); else await flush();
    const wait = 450 - (Date.now() - t0); if (wait > 0) await new Promise(r => setTimeout(r, wait));
    set(SHOW, S.authErr ? 'Needs the PIN' : S.netErr ? 'Could not reach the Sheet' : S.queue.length ? 'Waiting to send ' + S.queue.length + ' saved here' : 'Up to date');
    setTimeout(() => { set(0); busy = false; }, 1000);
  }
  view.addEventListener('touchstart', e => {
    const ok = !busy && !S.locked && S.cfg.url && S.connectStep !== 'who' && view.scrollTop <= 0 && e.touches.length === 1 && !FORMS.includes(curPath());

})();
window.addEventListener('hashchange', () => {
  const p = curPath();
  if (S.stack.length > 1 && S.stack[S.stack.length - 2] === p) S.stack.pop(); else if (S.stack[S.stack.length - 1] !== p) S.stack.push(p);
  // A half finished entry is cleared once you leave the Add screen.
  if (S.lastRoute === '/expenses/add' && p !== '/expenses/add') S.draft = null;
  if (S.lastRoute === '/expenses/paste' && p !== '/expenses/paste' && p !== '/expenses/scan') S.paste = null;
  if (S.lastRoute === '/expenses/scan' && p !== '/expenses/scan') { S.scan = null; S.scanToken++; if (p !== '/expenses/paste') S.paste = null; }
  if (S.lastRoute === '/income/pay' && p !== '/income/pay') S.payDraft = null;
  if (S.lastRoute === '/income/job' && p !== '/income/job') S.jobDraft = null;
  closeDrawer(); render();
});

['cam', 'pick'].forEach(id => $('#' + id).addEventListener('change', e => { const f = e.target.files && e.target.files[0]; e.target.value = ''; if (f) startScan(f); }));
document.querySelector('#lock h1').insertAdjacentHTML('afterbegin', MARK(34));
window.__ledger = { parseReceiptText, spreadTax, advanceOnce, nextPayFor }; // test hook for the tax maths

S.stack.push(curPath());
if (S.cfg.pin && Date.now() - lastActive > S.prefs.lockMin * 60000) { S.locked = true; $('#lock').hidden = false; }
render();
if (S.cfg.url && !S.locked) flush();
if ('serviceWorker' in navigator && /^https:|^http:\/\/localhost/.test(location.href)) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
</body>
